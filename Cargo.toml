[package]
name = "diorama_raycasting"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "webp"] }
minifb = "0.28"
nalgebra = "0.33"

[profile.dev]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

